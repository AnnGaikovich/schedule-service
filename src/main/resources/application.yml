server:
  port: 8082

spring:
  application:
    name: schedule-service
  datasource:
    url: jdbc:postgresql://localhost:5432/schedule_db
    username: postgres
    password: 123456
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  session:
    store-type: none   # ????????? ??????

app:
  auth-service:
    url: http://localhost:8080

logging:
  level:
    org.springframework.security: DEBUG
    org.example.scheduleservice: DEBUG

    security:
      enabled: false