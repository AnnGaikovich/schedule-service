databaseChangeLog:
  - changeSet:
      id: 3
      author: Ann Gaikovich
      changes:
        - createTable:
            tableName: doctor_schedule
            remarks: "Слоты доступности врачей"
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: doctor_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: work_date, type: DATE, constraints: { nullable: false } }
              - column: { name: start_time, type: TIME, constraints: { nullable: false } }
              - column: { name: end_time, type: TIME, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addDefaultValue:
            tableName: doctor_schedule
            columnName: updated_at
            defaultValueComputed: CURRENT_TIMESTAMP
        - addUniqueConstraint:
            tableName: doctor_schedule
            constraintName: uk_doctor_slot
            columnNames: doctor_id, work_date, start_time
        - addForeignKeyConstraint:
            constraintName: fk_doctor_schedule_doctor
            baseTableName: doctor_schedule
            baseColumnNames: doctor_id
            referencedTableName: doctors
            referencedColumnNames: id
            onDelete: CASCADE